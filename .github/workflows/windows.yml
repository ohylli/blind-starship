name: Windows Validation

on:
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # See main.yml's build-windows job: caches vcpkg's compiled dependencies.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('cmake/automate-vcpkg.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
          path: |
            ~/AppData/Local/vcpkg/archives
      # See main.yml's build-windows job: caches the PRISM, Torch and
      # libultraship builds. This job builds Debug (the VS generator's default
      # when cmake --build gets no --config), so the keys say Debug.
      - name: Resolve dependency revisions
        id: deps
        shell: bash
        run: |
          echo "prism=$(grep -A1 'ethindp/prism' CMakeLists.txt | grep GIT_TAG | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "torch=$(git -C tools/Torch rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "libultraship=$(git -C libultraship rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache PRISM build
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-prism-Debug-${{ steps.deps.outputs.prism }}
          path: |
            build/x64/PrismExternal
      - name: Cache Torch build
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-torch-Debug-${{ steps.deps.outputs.torch }}
          path: |
            build/x64/TorchExternal
            build/x64/Torch
            build/x64/tools/Torch
      - name: Cache libultraship build
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-libultraship-Debug-${{ steps.deps.outputs.libultraship }}
          path: |
            libultraship
      # See main.yml's build-windows job: back-date the tools/Torch submodule
      # source so the cached .obj files win MSBuild's incremental-build check.
      - name: Back-date Torch sources for incremental build
        shell: bash
        run: find tools/Torch -type f -exec touch -d '2000-01-01' {} +
      - name: Build
        run: |
          cmake -S . -B "build/x64" -G "Visual Studio 17 2022" -T v143 -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build ./build/x64
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: starship-windows
          path: ./build/x64/Debug
          retention-days: 1