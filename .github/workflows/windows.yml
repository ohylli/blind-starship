name: Windows Validation

on:
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # See main.yml's build-windows job: caches vcpkg's compiled dependencies.
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('cmake/automate-vcpkg.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
          path: |
            ~/AppData/Local/vcpkg/archives
      - name: Build
        run: |
          cmake -S . -B "build/x64" -G "Visual Studio 17 2022" -T v143 -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build ./build/x64
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: starship-windows
          path: ./build/x64/Debug
          retention-days: 1